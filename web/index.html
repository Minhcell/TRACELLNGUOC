<title>Tra CGI Ngược</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Bố cục: gọn cho điện thoại (một cột, các ô nằm sát nhau); PC rộng thì hai cột nhập | kết quả */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#243141; --muted:#5b6878; --line:#cdd4da; --btn:#e6e9ec;
  --accent:#1d6a86; --accent-fg:#ffffff; --ok:#1d7a4c; --warn:#a86108; --err:#b3261e;
  --vt:#c3122f; --vn:#0b6fc0; --mb:#6a3fb8; --vnm:#d07a00; --gm:#2e8b57; --it:#7a7f87;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --h:34px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151b; --panel:#18202a; --fg:#dfe6ee; --muted:#93a1b1; --line:#2d3947; --btn:#243040;
  --accent:#5cb6d6; --accent-fg:#0b1a22; --ok:#5ccf93; --warn:#f0b05a; --err:#ff8a80;
  --vt:#ff5c74; --vn:#5aa9ff; --mb:#b18cff; --vnm:#ffb347; --gm:#6fd49c; --it:#a7adb5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --panel:#18202a; --fg:#dfe6ee; --muted:#93a1b1; --line:#2d3947; --btn:#243040;
  --accent:#5cb6d6; --accent-fg:#0b1a22; --ok:#5ccf93; --warn:#f0b05a; --err:#ff8a80;
  --vt:#ff5c74; --vn:#5aa9ff; --mb:#b18cff; --vnm:#ffb347; --gm:#6fd49c; --it:#a7adb5; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-ui);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-block:10px 20px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
h1{margin:0;font-size:1.05rem;font-weight:700;white-space:nowrap}
.pill{font-size:.7rem;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.pill.on{color:var(--ok);border-color:var(--ok)}
.layout{display:flex;flex-direction:column;gap:8px}
.side,.main{display:flex;flex-direction:column;gap:8px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.line{display:flex;gap:6px;align-items:center;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input[type=text],input[type=password],select{font:inherit;font-size:.88rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;height:var(--h);padding:0 8px;min-width:0;width:100%}
select{padding-right:4px}
#coord{flex:1;width:auto;font-family:var(--f-mono);font-size:.86rem}
#coord.bad{border-color:var(--err);box-shadow:inset 0 0 0 1px var(--err)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:.85rem;font-weight:500;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:6px;height:var(--h);padding:0 10px;cursor:pointer;white-space:nowrap}
button.sm{flex:none;height:calc(var(--h) - 2px);padding:0 10px;font-size:.82rem}
button:disabled{opacity:.5;cursor:default}
.primary{width:100%;height:calc(var(--h) + 6px);background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;font-size:.95rem}
.trio{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:6px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.seg{display:flex;flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--btn)}
.seg .chip{flex:1;min-width:0;border:0;border-radius:0;height:30px;padding:0 4px;font-size:.82rem;background:transparent;color:var(--fg)}
.seg .chip+.chip{border-left:1px solid var(--line)}
.seg .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.seg-src{flex:0 1 150px}
.chk{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);flex:none}
.src-act{display:flex;gap:6px;flex:none;margin-left:auto}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.msg{font-size:.8rem;margin:0}
.msg:empty{display:none}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
progress{width:100%;height:5px;accent-color:var(--accent)}
.src{display:flex;flex-direction:column;gap:6px}
.apis{display:flex;flex-direction:column;gap:4px;max-height:min(46vh,340px);overflow:auto}
.apibar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;border:1px solid var(--line);border-radius:7px;padding:4px 4px 4px 9px;background:var(--bg)}
.apisum{font-size:.82rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apisum b{font-weight:600}
.apisum .bad{color:var(--err);font-weight:600}
.apisum .off{color:var(--muted)}
#btnApiToggle .arr{display:inline-block;margin-left:2px}
#btnApiToggle[aria-expanded="true"] .arr{transform:rotate(180deg)}
.api{display:grid;grid-template-columns:auto 1fr auto;gap:0 8px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:var(--bg);font-size:.82rem}
.api.off{opacity:.55}
.api .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.api .tk{grid-column:2;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.api .st{grid-column:2/4;font-size:.72rem;color:var(--muted)}
.api .st.ok{color:var(--ok)} .api .st.err{color:var(--err)}
.api .act{display:flex;gap:3px;grid-row:1/3;grid-column:3}
.api .act button{height:26px;padding:0 7px;font-size:.74rem}
.api .ord{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);grid-row:1/3}
.addbox summary{font-size:.82rem;color:var(--accent);cursor:pointer;font-weight:600;list-style:none;padding:2px 0}
.addbox summary::-webkit-details-marker{display:none}
.addapi{display:grid;grid-template-columns:1fr 1.4fr;gap:6px;margin-top:6px}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.res-head h2{margin:0;font-size:.95rem;white-space:nowrap}
.res-head .row{flex-wrap:nowrap;gap:4px}
.res-body{display:flex;flex-direction:column;gap:8px;min-width:0}
#radar{width:min(260px,70vw);aspect-ratio:1/1;max-width:100%;display:block;margin:0 auto;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.list{display:flex;flex-direction:column;gap:6px;min-width:0}
.cell{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:7px;padding:7px 9px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;background:var(--panel);cursor:pointer;min-width:0}
.cell.sel{box-shadow:0 0 0 2px var(--c)}
.cell .no{font-family:var(--f-mono);color:var(--muted);font-size:.74rem;grid-row:span 2}
.cell .cp{height:26px;padding:0 8px;font-size:.74rem}
.cgi{font-family:var(--f-mono);font-weight:700;font-size:.92rem;word-break:break-all;min-width:0}
.meta{grid-column:2/4;font-size:.74rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
.meta b{color:var(--fg);font-weight:600}
.tag{font-size:.66rem;font-weight:700;letter-spacing:.04em;padding:0 5px;border-radius:4px;border:1px solid currentColor}
.tag.in{color:var(--ok)}
.cell a{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:14px 8px;font-size:.85rem}
footer{font-size:.7rem;color:var(--muted);text-align:center}
/* Điện thoại rất nhỏ */
@media (max-width:360px){
  body{font-size:13px} :root{--h:32px}
  .trio{grid-template-columns:1fr 1fr} .fld-net{grid-column:1/3}
  .seg .chip{font-size:.78rem}
  .res-head .row button{padding:0 7px}
}
/* Màn ngang thấp: thu nhỏ sơ đồ */
@media (max-height:500px) and (orientation:landscape){ #radar{width:min(180px,40vh)} }
/* Máy tính bảng / điện thoại lớn nằm ngang */
@media (min-width:640px){
  body{font-size:15px}
  .res-body{display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr);align-items:start}
  #radar{width:100%}
}
/* PC: hai cột */
@media (min-width:960px){
  .wrap{max-width:1240px;padding-block:16px 24px;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:1.3rem}
  .layout{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr);align-items:start;gap:16px}
  .side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  .panel{padding:14px;gap:10px}
  .res-body{grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:14px}
  #radar{position:sticky;top:12px}
  .list{max-height:calc(100vh - 130px);overflow:auto;padding-right:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- Thanh chọn tab ---- */
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--btn)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;height:36px;font-weight:600;font-size:.88rem}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
/* ---- Tab Tra TAC ---- */
#tq{font:13px/1.4 var(--f-mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-height:96px;resize:vertical}
.tc{border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:7px;padding:9px;display:flex;flex-direction:column;gap:6px;background:var(--panel);min-width:0}
.tc h3{margin:0;font-size:.95rem;font-family:var(--f-mono);word-break:break-all}
.tc .st{font-size:.82rem;font-weight:600}
.tc .st.ok{color:var(--ok)} .tc .st.warn{color:var(--warn)} .tc .st.err{color:var(--err)}
.big{font-family:var(--f-mono);font-size:1.25rem;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.84rem;align-items:center}
.kv>span:nth-child(odd){color:var(--muted)}
.cand{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.cand .why{grid-column:1/4;font-size:.74rem;color:var(--muted)}
.cand .pct{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--line);grid-column:1/4;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:.78rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:4px 3px;text-align:left}
.tbl th{color:var(--muted);font-weight:600}
.tblw{overflow-x:auto}
.tc details summary{cursor:pointer;font-size:.8rem;color:var(--accent);font-weight:600}
.tc a{color:var(--accent)}
</style>

<div class="wrap">
  <header>
    <h1>Tra CGI ngược</h1>
    <span class="pill" id="dataPill">Chưa nạp dữ liệu</span>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabBtnCgi" aria-selected="true" aria-controls="tabCgi">Tra CGI ngược</button>
    <button type="button" role="tab" id="tabBtnTac" aria-selected="false" aria-controls="tabTac">Tra LAC/TAC</button>
  </div>

  <div class="layout" id="tabCgi" role="tabpanel">
  <div class="side">
  <section class="panel" aria-label="Điều kiện tra">
    <div class="line">
      <input type="text" id="coord" value="10.957300, 106.842700" placeholder="Vĩ độ, kinh độ" autocomplete="off" aria-label="Vĩ độ, kinh độ">
      <button id="btnGps" type="button" class="sm">GPS</button>
    </div>
    <div class="trio">
      <label class="fld fld-net"><span class="lbl">Nhà mạng</span><select id="netSel"></select></label>
      <label class="fld"><span class="lbl">Bán kính</span>
        <select id="radius"><option value="300">300 m</option><option value="500">500 m</option><option value="1000" selected>1 km</option><option value="2000">2 km</option><option value="3000">3 km</option><option value="5000">5 km</option></select></label>
      <label class="fld"><span class="lbl">Tối đa</span>
        <select id="maxN"><option>10</option><option selected>30</option><option>50</option><option>100</option></select></label>
    </div>
    <div class="line">
      <div class="seg" id="radioChips" role="group" aria-label="Công nghệ"></div>
      <label class="chk"><input type="checkbox" id="hex"> HEX</label>
    </div>
    <div class="line">
      <div class="seg seg-src" id="srcChips" role="group" aria-label="Nguồn dữ liệu">
        <button type="button" class="chip" data-src="off" aria-pressed="true">Offline</button>
        <button type="button" class="chip" data-src="api" aria-pressed="false">API</button>
      </div>
      <div class="src-act" id="srcOff">
        <input type="file" id="file" accept=".gz,.csv,text/csv,application/gzip" hidden>
        <button type="button" id="btnFile" class="sm">Nạp file</button>
        <button type="button" id="btnClear" class="sm">Xóa</button>
      </div>
    </div>
    <progress id="prog" max="1" value="0" hidden></progress>
    <div class="src" id="srcApi" hidden>
      <div class="apibar">
        <span class="apisum" id="apiSum">Chưa có API</span>
        <button type="button" id="btnApiToggle" class="sm" aria-expanded="false" aria-controls="apiList" disabled>Xem API <span class="arr" aria-hidden="true">▾</span></button>
      </div>
      <div class="apis" id="apiList" hidden></div>
      <details class="addbox"><summary>+ Thêm API</summary>
        <div class="addapi">
          <input type="text" id="apiName" placeholder="Tên" autocomplete="off" aria-label="Tên API">
          <input type="password" id="token" placeholder="Token pk.xxx" autocomplete="off" aria-label="Token OpenCelliD">
          <input type="text" id="apiHost" value="https://opencellid.org" autocomplete="off" aria-label="Máy chủ API">
          <button type="button" id="btnAddApi" class="sm">Thêm</button>
        </div>
      </details>
    </div>
    <button class="primary" id="btnFind" type="button">Tìm CGI</button>
    <p class="msg" id="msg" role="status"></p>
  </section>
  </div>

  <div class="main">
  <section class="panel" aria-labelledby="l-res">
    <div class="res-head">
      <h2 id="l-res">Kết quả</h2>
      <div class="row">
        <button type="button" id="btnCopyAll" class="sm" disabled>Chép CGI</button>
        <button type="button" id="btnCsv" class="sm" disabled>CSV</button>
        <button type="button" id="btnKml" class="sm" disabled>KML</button>
      </div>
    </div>
    <div class="res-body">
    <canvas id="radar" width="600" height="600" aria-label="Sơ đồ vị trí cell quanh điểm tra"></canvas>
    <div class="list" id="list">
      <div class="empty">Chưa có kết quả.</div>
    </div>
    </div>
  </section>

  <footer>Dữ liệu cell: OpenCelliD (CC BY-SA 4.0).</footer>
  </div>
  </div>

  <div class="layout" id="tabTac" role="tabpanel" hidden>
  <div class="side">
  <section class="panel" aria-label="Tra LAC/TAC từ ECGI">
    <textarea id="tq" spellcheck="false" placeholder="452-01-253826161&#10;hoặc dán nguyên kết quả lệnh gsh get_subscriber"></textarea>
    <div class="line">
      <label class="fld" style="flex:1"><span class="lbl">Mạng (khi nhập số trơn)</span><select id="tnet"></select></label>
      <div class="src-act" style="align-self:flex-end">
        <button type="button" id="tFile" class="sm">Nạp file</button>
        <button type="button" id="tClr" class="sm">Xóa ô</button>
      </div>
    </div>
    <button class="primary" id="tFind" type="button">Tìm LAC/TAC</button>
    <p class="msg" id="tmsg" role="status"></p>
  </section>
  </div>
  <div class="main">
  <section class="panel" aria-labelledby="l-tres">
    <div class="res-head"><h2 id="l-tres">Kết quả</h2></div>
    <div class="list" id="tlist"><div class="empty">Chưa có kết quả.</div></div>
  </section>
  <footer>Dữ liệu cell: OpenCelliD (CC BY-SA 4.0).</footer>
  </div>
  </div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const NETS=[
 {mnc:4,name:"Viettel",v:"--vt"},{mnc:2,name:"Vinaphone",v:"--vn"},{mnc:1,name:"MobiFone",v:"--mb"},
 {mnc:5,name:"Vietnamobile",v:"--vnm"},{mnc:7,name:"Gmobile",v:"--gm"},{mnc:8,name:"Itel",v:"--it"},
 {mnc:0,name:"Tất cả",v:"--accent"}];
const NETMAP={};NETS.forEach(n=>NETMAP[n.mnc]=n);
const RADIOS=[{k:0,t:"Tất cả"},{k:2,t:"3G",s:"UMTS"},{k:4,t:"4G",s:"LTE"},{k:5,t:"5G",s:"NR"}];
const RCODE={GSM:1,UMTS:2,CDMA:3,LTE:4,NR:5};
const RNAME={1:"2G",2:"3G",3:"CDMA",4:"4G",5:"5G"};
const state={net:4,radio:0,src:"off",results:[],sel:-1,center:null,R:1000};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- chips ---------- */
function mkChips(box,items,key,onPick){
  box.innerHTML="";
  items.forEach(it=>{
    const b=document.createElement("button");b.type="button";b.className="chip";
    if(it.v)b.style.setProperty("--c","var("+it.v+")");
    b.innerHTML=(it.v?'<span class="dot"></span>':'')+it.label+(it.sub?' <span class="mnc">'+it.sub+'</span>':'');
    b.setAttribute("aria-pressed",String(it[key]===state[key==="mnc"?"net":"radio"]));
    b.onclick=()=>{onPick(it);[...box.children].forEach(c=>c.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");};
    box.appendChild(b);
  });
}
const savedNet=ls.get("tracgi.net");if(savedNet!==null&&NETMAP[+savedNet])state.net=+savedNet;
{const ns=$("netSel");
  NETS.forEach(n=>{const o=document.createElement("option");o.value=n.mnc;o.textContent=n.mnc?n.name+" ("+String(n.mnc).padStart(2,"0")+")":"Tất cả";ns.appendChild(o)});
  ns.value=String(state.net);
  ns.onchange=()=>{state.net=+ns.value;ls.set("tracgi.net",state.net)};}
mkChips($("radioChips"),RADIOS.map(r=>({...r,label:r.t,sub:"",k:r.k})),"k",it=>{state.radio=it.k});
[...$("radioChips").children].forEach((c,i)=>c.setAttribute("aria-pressed",String(RADIOS[i].k===state.radio)));

$("srcChips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
  state.src=b.dataset.src;
  $("srcChips").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));
  $("srcOff").hidden=state.src!=="off";$("srcApi").hidden=state.src!=="api";ls.set("tracgi.src",state.src);
});
const savedSrc=ls.get("tracgi.src");if(savedSrc==="api")$("srcChips").querySelector('[data-src="api"]').click();
/* ---------- danh sách API ---------- */
let APIS=[];
try{APIS=JSON.parse(ls.get("tracgi.apis")||"[]")||[]}catch(e){APIS=[]}
const oldTok=ls.get("tracgi.token");
if(!APIS.length&&oldTok)APIS=[{name:"Token 1",token:oldTok,host:"https://opencellid.org",on:true}];
function saveApis(){ls.set("tracgi.apis",JSON.stringify(APIS.map(a=>({name:a.name,token:a.token,host:a.host,on:a.on,last:a.last,lastCls:a.lastCls}))))}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function mask(t){return t.length>10?t.slice(0,5)+"…"+t.slice(-4):t}
let apiOpen=false;
function renderApiSum(){

/* ---------- tọa độ ---------- */
function dms(str){
  const re=/(\d+(?:\.\d+)?)\s*°\s*(?:(\d+(?:\.\d+)?)\s*['′]\s*)?(?:(\d+(?:\.\d+)?)\s*(?:"|″|''))?\s*([NSEW])/gi;
  const out=[];let m;
  while((m=re.exec(str))){let v=+m[1]+(+m[2]||0)/60+(+m[3]||0)/3600;if(/[SW]/i.test(m[4]))v=-v;out.push({v,ax:/[NS]/i.test(m[4])?"lat":"lon"});}
  if(out.length===2){const la=out.find(o=>o.ax==="lat"),lo=out.find(o=>o.ax==="lon");if(la&&lo)return[la.v,lo.v];}
  return null;
}
function parseCoord(s){
  s=(s||"").trim();if(!s)return null;
  let m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(m)return chk(+m[1],+m[2]);
  const d=dms(s);if(d)return chk(d[0],d[1]);
  const nums=s.replace(/,(?=\d{3,}\b)/g,".").match(/-?\d+(?:\.\d+)?/g);
  if(nums&&nums.length>=2){let a=+nums[0],b=+nums[1];if(Math.abs(a)>90&&Math.abs(b)<=90)[a,b]=[b,a];return chk(a,b);}
  return null;
  function chk(a,b){return(Math.abs(a)<=90&&Math.abs(b)<=180&&isFinite(a)&&isFinite(b))?[a,b]:null}
}

};

/* ---------- kho dữ liệu offline ---------- */
const DB={n:0,cap:0,a:null,name:""};
function alloc(c){
  const nw={lat:new Float64Array(c),lon:new Float64Array(c),cell:new Float64Array(c),area:new Uint32Array(c),net:new Uint16Array(c),radio:new Uint8Array(c),range:new Uint32Array(c),samples:new Uint32Array(c),upd:new Uint32Array(c)};
  if(DB.a)for(const k in nw)nw[k].set(DB.a[k].subarray(0,DB.n));
  DB.a=nw;DB.cap=c;
}
function resetDB(){DB.n=0;DB.a=null;alloc(1<<18)}
function addLine(line){
  if(!line||line.charCodeAt(0)<65)return;
  const f=line.split(",");if(f.length<9||f[0]==="radio")return;
  if(f[1]!=="452")return;
  const lat=+f[7],lon=+f[6];if(!isFinite(lat)||!isFinite(lon))return;
  if(DB.n>=DB.cap)alloc(DB.cap*2);
  const a=DB.a,i=DB.n++;
  a.radio[i]=RCODE[f[0]]||0;a.net[i]=+f[2];a.area[i]=+f[3];a.cell[i]=+f[4];
  a.lon[i]=lon;a.lat[i]=lat;a.range[i]=+f[8]||0;a.samples[i]=+f[9]||0;a.upd[i]=+f[12]||0;
}
async function loadBlob(blob,name){
  const head=new Uint8Array(await blob.slice(0,2).arrayBuffer());
  const gz=head[0]===0x1f&&head[1]===0x8b;
  let stream=blob.stream();const total=blob.size;let read=0;
  const prog=$("prog");prog.hidden=false;prog.value=0;
  stream=stream.pipeThrough(new TransformStream({transform(ch,c){read+=ch.byteLength;c.enqueue(ch)}}));
  if(gz){
    if(typeof DecompressionStream==="undefined")throw new Error("WebView quá cũ, không giải nén được .gz. Hãy giải nén ra .csv rồi nạp.");
    stream=stream.pipeThrough(new DecompressionStream("gzip"));
  }
  const reader=stream.pipeThrough(new TextDecoderStream()).getReader();
  resetDB();let buf="",tick=0;
  for(;;){
    const {value,done}=await reader.read();if(done)break;
    buf+=value;let s=0,i;
    while((i=buf.indexOf("\n",s))>=0){addLine(buf.slice(s,i).trim());s=i+1}
    buf=buf.slice(s);
    if(++tick%20===0){prog.value=read/total;say("Đang đọc "+name+": "+(read/1048576).toFixed(1)+" / "+(total/1048576).toFixed(1)+" MB, "+DB.n.toLocaleString("vi-VN")+" cell");await new Promise(r=>setTimeout(r))}
  }
  addLine(buf.trim());prog.hidden=true;DB.name=name;
  if(!DB.n)throw new Error("File không có dòng cell MCC 452 nào. Kiểm tra lại đúng file OpenCelliD của Việt Nam.");
  updatePill();
}
function updatePill(){
  const p=$("dataPill");
  if(DB.n){const c={};for(let i=0;i<DB.n;i++)c[DB.a.net[i]]=(c[DB.a.net[i]]||0)+1;
    p.textContent=DB.n.toLocaleString("vi-VN")+" cell · "+DB.name;p.className="pill on";
    p.title=Object.keys(c).map(k=>(NETMAP[k]?NETMAP[k].name:"MNC "+k)+": "+c[k].toLocaleString("vi-VN")).join("\n");}
  else{p.textContent="Chưa nạp dữ liệu";p.className="pill"}
}
/* lưu file vào IndexedDB để lần sau khỏi nạp */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("tracgi",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbPut(v){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(v,"csv");t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function idbGet(){try{const d=await idb();return await new Promise(res=>{const t=d.transaction("f").objectStore("f").get("csv");t.onsuccess=()=>res(t.result);t.onerror=()=>res(null)})}catch(e){return null}}
async function idbDel(){try{const d=await idb();d.transaction("f","readwrite").objectStore("f").delete("csv")}catch(e){}}

/* ---------- hình học ---------- */
const RAD=Math.PI/180;
function dist(a1,o1,a2,o2){const dA=(a2-a1)*RAD,dO=(o2-o1)*RAD,s=Math.sin(dA/2)**2+Math.cos(a1*RAD)*Math.cos(a2*RAD)*Math.sin(dO/2)**2;return 12742000*Math.asin(Math.sqrt(s))}
function bearing(a1,o1,a2,o2){const y=Math.sin((o2-o1)*RAD)*Math.cos(a2*RAD),x=Math.cos(a1*RAD)*Math.sin(a2*RAD)-Math.sin(a1*RAD)*Math.cos(a2*RAD)*Math.cos((o2-o1)*RAD);return(Math.atan2(y,x)/RAD+360)%360}
const HUONG=["B","ĐB","Đ","ĐN","N","TN","T","TB"];
function huong(b){return HUONG[Math.round(b/45)%8]}

/* ---------- truy vấn ---------- */
function queryOffline(lat,lon,R,net,radio,max){
  if(!DB.n)throw new Error("Chưa có dữ liệu offline. Bấm “Nạp file CSV / CSV.GZ” và chọn 452.csv.gz.");
  const a=DB.a,dLat=R/111320,dLon=R/(111320*Math.cos(lat*RAD)),out=[];
  for(let i=0;i<DB.n;i++){
    if(a.radio[i]===1)continue;
    if(net&&a.net[i]!==net)continue;if(radio&&a.radio[i]!==radio)continue;
    const la=a.lat[i],lo=a.lon[i];if(la<lat-dLat||la>lat+dLat||lo<lon-dLon||lo>lon+dLon)continue;
    const d=dist(lat,lon,la,lo);if(d>R)continue;
    out.push({radio:a.radio[i],net:a.net[i],area:a.area[i],cell:a.cell[i],lat:la,lon:lo,range:a.range[i],samples:a.samples[i],upd:a.upd[i],d});
  }
  return out.sort((x,y)=>x.d-y.d).slice(0,max);
}
/* Cách gọi API, tránh lỗi trình duyệt chặn (CORS):
   - Trong APK: gọi /api/ocid, app Android tự gọi máy chủ API.
   - Trên Netlify: gọi /ocid-api/... , file _redirects chuyển tiếp sang opencellid.org.
   - Nơi khác (mở file trực tiếp...): gọi thẳng máy chủ API. */
let NETLIFY_OK=null;
async function apiFetch(host,qs){
  if(window.AndroidSave&&/^https?:$/.test(location.protocol)){
    return fetch("/api/ocid?host="+encodeURIComponent(host)+"&"+qs,{cache:"no-store"});
  }
  if(NETLIFY_OK!==false&&/^https?:$/.test(location.protocol)&&/^https:\/\/(www\.)?opencellid\.org$/i.test(host)){
    try{
      const rs=await fetch("/ocid-api/cell/getInArea?"+qs,{cache:"no-store"});
      if(!/text\/html/i.test(rs.headers.get("content-type")||"")){NETLIFY_OK=true;return rs}
    }catch(e){}
    NETLIFY_OK=false;
  }
  return fetch(host+"/cell/getInArea?"+qs,{cache:"no-store"});
}
async function queryApiOne(api,label,lat,lon,R,net,radio,max){
  const step=1900,n=Math.min(5,Math.ceil(2*R/step)),dLat=step/111320,dLon=step/(111320*Math.cos(lat*RAD));
  const lat0=lat-n*dLat/2,lon0=lon-n*dLon/2,seen=new Map();let k=0;
  const host=(api.host||"https://opencellid.org").replace(/\/+$/,"");
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    k++;say("Đang hỏi "+label+", ô "+k+"/"+n*n+"…");
    const b=[lat0+r*dLat,lon0+c*dLon,lat0+(r+1)*dLat,lon0+(c+1)*dLon].map(v=>v.toFixed(6)).join(",");
    let url=host+"/cell/getInArea?key="+encodeURIComponent(api.token)+"&BBOX="+b+"&mcc=452&limit=50&format=json";
    if(net)url+="&mnc="+net;
    if(radio)url+="&radio="+({2:"UMTS",4:"LTE",5:"NR"})[radio];
    let rs,txt,j;
    try{rs=await apiFetch(host,url.slice(url.indexOf("?")+1));txt=await rs.text()}catch(e){throw new Error("không kết nối được máy chủ")}
    try{j=JSON.parse(txt)}catch(e){
      if(rs.status===401||rs.status===403)throw new Error("token sai hoặc bị khóa");
      if(rs.status===429)throw new Error("hết lượt tra");
      throw new Error("máy chủ trả về dữ liệu lạ (HTTP "+rs.status+")");
    }
    if(j.error){
      if(/not found|no cells|no data/i.test(j.error))continue;
      if(/limit|exceed|quota/i.test(j.error))throw new Error("hết lượt tra ("+j.error+")");
      if(/key|token|invalid|unauthor/i.test(j.error))throw new Error("token sai ("+j.error+")");
      throw new Error(j.error);
    }
    (j.cells||[]).forEach(x=>{
      const o={radio:RCODE[x.radio]||0,net:+x.mnc,area:+(x.lac??x.tac??x.area),cell:+(x.cellid??x.cell),lat:+x.lat,lon:+x.lon,range:+x.range||0,samples:+x.samples||0,upd:+x.updated||0};
      if(o.radio===1)return;
      o.d=dist(lat,lon,o.lat,o.lon);if(o.d<=R)seen.set(o.radio+"-"+o.net+"-"+o.area+"-"+o.cell,o);
    });
  }
  return [...seen.values()].sort((x,y)=>x.d-y.d).slice(0,max);
}
async function queryApi(lat,lon,R,net,radio,max){
  const list=APIS.filter(a=>a.on);
  if(!list.length)throw new Error(APIS.length?"Tất cả API đang tắt. Bật ít nhất một API.":"Chưa có API nào. Thêm token ở mục Nguồn dữ liệu.");
  const log=[];let anyEmpty=false;state.apiUsed="";
  for(let i=0;i<list.length;i++){
    const a=list[i],label="API "+(i+1)+"/"+list.length+" ("+a.name+")";
    try{
      const r=await queryApiOne(a,label,lat,lon,R,net,radio,max);
      if(r.length){a.last=r.length+" cell";a.lastCls="ok";saveApis();renderApis();state.apiUsed=a.name;return r}
      a.last="không ra cell nào";a.lastCls="";anyEmpty=true;log.push(a.name+": không ra cell");
    }catch(e){a.last="lỗi, "+e.message;a.lastCls="err";log.push(a.name+": "+e.message)}
    saveApis();renderApis();
  }
  if(anyEmpty){state.apiLog=log.join("; ");return []}
  throw new Error("Đã thử hết "+list.length+" API, không API nào tra được. "+log.join("; ")+".");
}

/* ---------- hiển thị ---------- */
function fmtD(d){return d<1000?Math.round(d)+" m":(d/1000).toFixed(2)+" km"}
function num(v){return $("hex").checked?Math.round(v).toString(16).toUpperCase():String(Math.round(v))}
function cgi(o){return "452-"+String(o.net).padStart(2,"0")+"-"+num(o.area)+"-"+num(o.cell)}
function sub(o){
  if(o.radio===4)return "eNB "+Math.floor(o.cell/256)+" · sector "+(o.cell%256);
  if(o.radio===2&&o.cell>65535)return "RNC "+Math.floor(o.cell/65536)+" · CID "+(o.cell%65536);
  if(o.radio===5)return "gNB "+Math.floor(o.cell/4096)+" · cell "+(o.cell%4096);
  return "";
}
function color(net){const n=NETMAP[net];return getComputedStyle(document.documentElement).getPropertyValue(n?n.v:"--it").trim()||"#888"}
function render(){
  const L=$("list"),r=state.results,hasR=r.length>0;
  ["btnCopyAll","btnCsv","btnKml"].forEach(id=>$(id).disabled=!hasR);
  if(!hasR){L.innerHTML='<div class="empty">'+(state.center?"Không có cell nào khớp điều kiện.":"Chưa có kết quả.")+'</div>';drawRadar();return}
  L.innerHTML="";
  r.forEach((o,i)=>{
    const d=document.createElement("div");d.className="cell"+(i===state.sel?" sel":"");
    d.style.setProperty("--c","var("+(NETMAP[o.net]?NETMAP[o.net].v:"--it")+")");
    const b=bearing(state.center[0],state.center[1],o.lat,o.lon);
    const inR=o.range&&o.d<=o.range;
    d.innerHTML='<span class="no">'+String(i+1).padStart(2,"0")+'</span>'+
      '<span class="cgi">'+cgi(o)+'</span>'+
      '<button type="button" class="cp">Chép</button>'+
      '<div class="meta"><span><b>'+(NETMAP[o.net]?NETMAP[o.net].name:"MNC "+o.net)+'</b> '+(RNAME[o.radio]||"?")+'</span>'+
      '<span>'+(o.radio===4||o.radio===5?"TAC":"LAC")+' <b>'+num(o.area)+'</b> · CI <b>'+num(o.cell)+'</b></span>'+
      (sub(o)?'<span>'+sub(o)+'</span>':'')+
      '<span>Cách <b>'+fmtD(o.d)+'</b> hướng '+huong(b)+' ('+Math.round(b)+'°)</span>'+
      (o.range?'<span>Phủ ~'+fmtD(o.range)+'</span>':'')+
      (inR?'<span class="tag in">TRONG VÙNG</span>':'')+
      (o.samples?'<span>'+o.samples+' mẫu</span>':'')+
      (o.upd?'<span>Cập nhật '+new Date(o.upd*1000).toLocaleDateString("vi-VN")+'</span>':'')+
      '<a href="https://www.google.com/maps?q='+o.lat.toFixed(6)+','+o.lon.toFixed(6)+'" target="_blank" rel="noopener">Bản đồ</a></div>';
    d.onclick=ev=>{if(ev.target.tagName==="A")return;if(ev.target.classList.contains("cp")){copy(cgi(o),ev.target);return}state.sel=i;render()};
    L.appendChild(d);
  });
  drawRadar();
}
function copy(t,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent="Đã chép";setTimeout(()=>btn.textContent=o,1200)}else say("Đã chép vào bộ nhớ tạm.","ok")};
  const fb=()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){say("Không chép được, hãy chọn và chép tay.","err")}ta.remove()};
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}
}
$("btnCopyAll").onclick=e=>copy(state.results.map(cgi).join("\n"),e.target);

function drawRadar(){
  const cv=$("radar");cv.hidden=!state.results.length;if(cv.hidden)return;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||600;
  cv.width=w*dpr;cv.height=w*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),fg=cs.getPropertyValue("--fg").trim(),mu=cs.getPropertyValue("--muted").trim(),ln=cs.getPropertyValue("--line").trim(),ac=cs.getPropertyValue("--accent").trim();
  const cx=w/2,cy=w/2,rad=w/2-26;g.clearRect(0,0,w,w);
  g.font="11px "+cs.getPropertyValue("--f-mono");g.textAlign="center";
  for(let k=1;k<=3;k++){g.beginPath();g.arc(cx,cy,rad*k/3,0,7);g.strokeStyle=ln;g.lineWidth=1;g.stroke();g.fillStyle=mu;g.fillText(fmtD(state.R*k/3),cx,cy-rad*k/3-3)}
  g.beginPath();g.moveTo(cx,cy-rad);g.lineTo(cx,cy+rad);g.moveTo(cx-rad,cy);g.lineTo(cx+rad,cy);g.strokeStyle=ln;g.setLineDash([3,4]);g.stroke();g.setLineDash([]);
  g.fillStyle=fg;g.font="600 12px "+cs.getPropertyValue("--f-ui");g.fillText("B",cx,14);

  const sc=rad/state.R;
  state.results.forEach((o,i)=>{
    if(!state.center)return;
    const x=cx+(o.lon-state.center[1])*111320*Math.cos(state.center[0]*RAD)*sc,y=cy-(o.lat-state.center[0])*111320*sc,col=color(o.net);
    if(i===state.sel&&o.range){g.beginPath();g.arc(x,y,Math.min(o.range*sc,w),0,7);g.fillStyle=col+"22";g.fill();g.strokeStyle=col;g.stroke()}
    g.beginPath();g.arc(x,y,i===state.sel?7:5,0,7);g.fillStyle=col;g.fill();
    if(i===state.sel){g.lineWidth=2;g.strokeStyle=fg;g.stroke();g.lineWidth=1}
    g.fillStyle=fg;g.font="10px "+cs.getPropertyValue("--f-mono");g.fillText(String(i+1),x,y-9);
  });
  if(state.center){g.beginPath();g.arc(cx,cy,6,0,7);g.fillStyle=ac;g.fill();g.beginPath();g.arc(cx,cy,11,0,7);g.strokeStyle=ac;g.lineWidth=2;g.stroke();g.lineWidth=1}
}

/* Đọc nội dung dán vào: ECGI, MCC-MNC-eNB-Cell, MCC-MNC-TAC-ECI, danh sách trạm, số trơn, hex */
function tParse(txt,defNet){
  const cells=[],enbs=[],sc=new Set(),se=new Set(),tai={};
  const addC=(net,eci,tac)=>{const k=net+":"+eci;if(sc.has(k))return;sc.add(k);cells.push({net,eci,tac})};
  const addE=(net,enb)=>{const k=net+":"+enb;if(se.has(k))return;se.add(k);enbs.push({net,enb})};
  /* Ngăn cách nhận được: gạch ngang, dấu chấm, gạch dưới, gạch chéo, hai chấm, dấu cách */
  const S="(?:\\s*[-._/:]\\s*|[ \\t]+)";
  const re=new RegExp("\\b452"+S+"(\\d{2,3})"+S+"(?:([A-Za-z]+)"+S+")?(\\d+)(?:"+S+"(\\d+))?(?!\\d)","g");let m,any=false;
  /* Viết liền: 452 + MNC 2 số + ECI (vd 45201253826161). IMSI 15 số không bị nhận nhầm */
  const reJoin=/\b452(\d{2})(\d{4,9})\b/g;
  while((m=reJoin.exec(txt))){any=true;addC(+m[1],+m[2],null)}
  while((m=re.exec(txt))){
    any=true;const net=+m[1],a=+m[3];
    const ln=txt.slice(txt.lastIndexOf("\n",m.index)+1,m.index);
    if(!m[2]&&m[4]===undefined&&/\b(TAI|TAC|Tracking|LAI|LAC)\b/i.test(ln)){if(/TAI|TAC|Tracking/i.test(ln))tai[net]=a;continue} // dòng TAI: lấy TAC từ MME
    if(m[2])addE(net,a);
    else if(m[4]!==undefined){const b=+m[4];if(b>255)addC(net,b,a);else addC(net,a*256+b,null)}
    else if(a>1048575)addC(net,a,null);else addE(net,a);
  }
  if(!any){
    for(const tok of txt.split(/[\s,;]+/)){
      if(!tok)continue;
      const pr=tok.match(/^(\d+)[-._/:](\d+)$/); // eNB-cell, eNB.cell
      if(pr){const a=+pr[1],b=+pr[2];if(b<=255&&a<=1048575)addC(defNet,a*256+b,null);else if(b>255)addC(defNet,b,a);continue}
      if(/^(0x)?[0-9a-f]+$/i.test(tok)&&/[a-fx]/i.test(tok))addC(defNet,parseInt(tok.replace(/^0x/i,""),16),null);
      else if(/^\d+$/.test(tok)){const v=+tok;if(v<=1048575)addE(defNet,v);else addC(defNet,v,null)}
    }
  }
  cells.forEach(c=>{if(c.tac==null&&tai[c.net]!=null){c.tac=tai[c.net];c.fromTai=true}});
  return {cells,enbs};
}
/* Gom các cell LTE theo trạm cho những trạm cần xét (một lượt quét dữ liệu) */
function tCollect(want){
  const map=new Map(),seen=new Set();
  const put=(net,cell,area,lat,lon,samples,upd,range,src)=>{
    const enb=Math.floor(cell/256);
    if(!want(net,enb))return;
    const k=net+"-"+cell;if(seen.has(k))return;seen.add(k);
    const key=net*2097152+enb;let g=map.get(key);
    if(!g){g={net,enb,cells:[]};map.set(key,g)}
    g.cells.push({net,cell,area,lat,lon,samples,upd,range,src});
  };
  if(DB.n){const a=DB.a;for(let i=0;i<DB.n;i++){if(a.radio[i]!==4)continue;put(a.net[i],a.cell[i],a.area[i],a.lat[i],a.lon[i],a.samples[i],a.upd[i],a.range[i],"file")}}
  TAC.extra.forEach(o=>{if(o.radio===4)put(o.net,o.cell,o.area,o.lat,o.lon,o.samples,o.upd,o.range,"api")});
  map.forEach(g=>{
    let la=0,lo=0;const tc=new Map();
    g.cells.forEach(c=>{la+=c.lat;lo+=c.lon;tc.set(c.area,(tc.get(c.area)||0)+1)});
    g.lat=la/g.cells.length;g.lon=lo/g.cells.length;g.tacs=[...tc].sort((x,y)=>y[1]-x[1]);
  });
  return map;
}
const NEAR=64;
function tAnalyze(t,enbList,map){
  const nets=t.net?[t.net]:NETS.filter(n=>n.mnc).map(n=>n.mnc);
  const enb=Math.floor(t.eci/256),r={t,enb,cid:t.eci%256,exact:[],same:null,via:[],near:[],score:new Map(),pos:null,posWhy:""};
  const add=(tac,w,why)=>{let s=r.score.get(tac);if(!s){s={tac,w:0,why:[]};r.score.set(tac,s)}s.w+=w;s.why.push(why)};
  for(const net of nets){
    const g=map.get(net*2097152+enb);
    if(g){
      g.cells.filter(c=>c.cell===t.eci).forEach(c=>r.exact.push(c));
      const others=g.cells.filter(c=>c.cell!==t.eci);
      if(others.length){r.same=g;const tc=new Map();others.forEach(c=>tc.set(c.area,(tc.get(c.area)||0)+1));
        tc.forEach((n,tac)=>add(tac,40*n,n+" cell khác cùng trạm "+enb))}
      if(!r.pos){r.pos=[g.lat,g.lon];r.posWhy="tâm các cell của trạm "+enb}
    }
    enbList.filter(e=>e.net===net&&e.enb!==enb).forEach(e=>{
      const h=map.get(net*2097152+e.enb);
      r.via.push({enb:e.enb,net,g:h||null});
      if(h)h.tacs.forEach(([tac,n])=>add(tac,8*n/h.cells.length,"trạm đã đi qua "+e.enb));
    });
    map.forEach(h=>{
      if(h.net!==net||h.enb===enb)return;const d=Math.abs(h.enb-enb);if(d>NEAR)return;
      r.near.push({...h,d});
    });
  }
  r.near.sort((a,b)=>a.d-b.d);
  r.near.slice(0,12).forEach(h=>h.tacs.forEach(([tac,n])=>add(tac,4/(1+h.d/6)*n/h.cells.length,"trạm số hiệu gần "+h.enb+" (lệch "+h.d+")")));
  if(!r.pos){
    const v=r.via.filter(x=>x.g);
    if(v.length){const la=v.map(x=>x.g.lat).sort((a,b)=>a-b),lo=v.map(x=>x.g.lon).sort((a,b)=>a-b),m=Math.floor(v.length/2);
      r.pos=[la[m],lo[m]];r.posWhy="giữa "+v.length+" trạm thuê bao vừa đi qua (độ chính xác thấp)"}
    else if(r.near.length){r.pos=[r.near[0].lat,r.near[0].lon];r.posWhy="trạm số hiệu gần nhất "+r.near[0].enb+" (độ chính xác thấp)"}
  }
  const tot=[...r.score.values()].reduce((s,x)=>s+x.w,0);
  r.cands=[...r.score.values()].sort((a,b)=>b.w-a.w).map(x=>({...x,pct:tot?Math.round(100*x.w/tot):0}));
  return r;
}
const mapsA=(la,lo,txt)=>'<a href="https://www.google.com/maps?q='+la.toFixed(6)+','+lo.toFixed(6)+'" target="_blank" rel="noopener">'+(txt||la.toFixed(5)+", "+lo.toFixed(5))+'</a>';
const n2=n=>String(n).padStart(2,"0");
function tCgi(net,tac,eci){return "452-"+n2(net)+"-"+tac+"-"+eci}
function tCardHtml(r,idx){
  const t=r.t,net=t.net||(r.exact[0]&&r.exact[0].net)||(r.same&&r.same.net)||0;
  const col=NETMAP[net]?NETMAP[net].v:"--accent";
  let h='<div class="tc" style="--c:var('+col+')"><h3>'+(net?"452-"+n2(net)+"-":"")+t.eci+'</h3>'+
    '<div class="kv"><span>Trạm eNB</span><span><b>'+r.enb+'</b> · cell '+r.cid+' · HEX '+t.eci.toString(16).toUpperCase()+'</span>'+
    (net?'<span>Nhà mạng</span><span>'+(NETMAP[net]?NETMAP[net].name:"MNC "+net)+'</span>':'')+'</div>';
  if(t.fromTai)h+='<div class="st ok">✔ TAC lấy từ dòng TAI của MME (chính xác)</div><div class="kv"><span>TAC</span><span class="big">'+t.tac+'</span>'+
    '<span>CGI nhập app</span><span class="line"><span class="cgi">'+tCgi(net,t.tac,t.eci)+'</span><button type="button" class="sm cp" data-cp="'+tCgi(net,t.tac,t.eci)+'">Chép</button></span></div>';
  if(r.exact.length){
    r.exact.forEach(c=>{
      h+='<div class="st ok">✔ Có đúng cell này trong dữ liệu'+(c.src==="api"?" (API)":"")+'</div>'+
        '<div class="kv"><span>TAC</span><span class="big">'+c.area+'</span>'+
        '<span>CGI nhập app</span><span class="line"><span class="cgi">'+tCgi(c.net,c.area,c.cell)+'</span><button type="button" class="sm cp" data-cp="'+tCgi(c.net,c.area,c.cell)+'">Chép</button></span>'+
        '<span>Tọa độ cell</span><span>'+mapsA(c.lat,c.lon)+'</span>'+
        '<span>Phủ / mẫu</span><span>~'+fmtD(c.range||0)+' · '+c.samples+' mẫu'+(c.upd?' · cập nhật '+new Date(c.upd*1000).toLocaleDateString("vi-VN"):'')+'</span></div>';
      if(t.tac!=null&&t.tac!==c.area)h+='<div class="st warn">TAC đã nhập ('+t.tac+') khác TAC trong dữ liệu ('+c.area+').</div>';
    });
  }else if(r.cands.length){
    const top=r.cands[0],sure=r.same&&top.pct>=60;
    h+='<div class="st '+(sure?"ok":"warn")+'">'+(sure?"≈ Không có đúng cell, suy từ cell cùng trạm (tin cậy cao)":"≈ Không có cell này, TAC được ước lượng từ trạm lân cận — cần đối chiếu")+'</div>';
    r.cands.slice(0,4).forEach((c,i)=>{
      const cg=tCgi(net||1,c.tac,t.eci);
      h+='<div class="cand"><span class="big" style="font-size:'+(i?"1rem":"1.25rem")+'">'+c.tac+'</span>'+
        '<span class="cgi" style="font-size:.82rem">'+cg+'</span><button type="button" class="sm cp" data-cp="'+cg+'">Chép</button>'+
        '<span class="bar"><i style="width:'+c.pct+'%"></i></span>'+
        '<span class="why">'+c.pct+'% · '+esc([...new Set(c.why)].slice(0,3).join("; "))+(c.why.length>3?"; …":"")+'</span></div>';
    });
  }else{
    h+='<div class="st err">✘ Dữ liệu không có trạm '+r.enb+', không có trạm đã đi qua hay trạm số hiệu gần nào để suy TAC.</div>'+
      '<p class="hint">Cách chắc chắn: chạy lại trên MME không lọc (bỏ egrep) và đọc dòng TAI. Hoặc dán thêm cả dòng "Latest eNodeB List" để có căn cứ suy.</p>';
  }
  if(r.pos)h+='<div class="kv"><span>Vị trí ước lượng</span><span>'+mapsA(r.pos[0],r.pos[1])+' <span class="hint">('+esc(r.posWhy)+')</span></span></div>';
  if(r.pos&&!r.exact.length&&APIS.some(a=>a.on))h+='<button type="button" class="sm" data-api="'+idx+'">Hỏi thêm API quanh vị trí này (2 km)</button>';
  if(r.same){
    h+='<details><summary>Cell cùng trạm '+r.enb+' ('+r.same.cells.length+')</summary><div class="tblw"><table class="tbl"><tr><th>Cell</th><th>ECI</th><th>TAC</th><th>Tọa độ</th><th>Mẫu</th></tr>'+
      r.same.cells.slice().sort((a,b)=>a.cell-b.cell).map(c=>'<tr><td>'+(c.cell%256)+'</td><td>'+c.cell+'</td><td>'+c.area+'</td><td>'+mapsA(c.lat,c.lon)+'</td><td>'+c.samples+'</td></tr>').join("")+'</table></div></details>';
  }
  if(r.via.length){
    h+='<details'+(r.exact.length||r.same?"":" open")+'><summary>Trạm thuê bao vừa đi qua ('+r.via.length+')</summary><div class="tblw"><table class="tbl"><tr><th>#</th><th>eNB</th><th>TAC</th><th>Vị trí</th></tr>'+
      r.via.map((v,i)=>'<tr><td>'+(i+1)+'</td><td>'+v.enb+'</td><td>'+(v.g?v.g.tacs.map(x=>x[0]).join(", "):"–")+'</td><td>'+(v.g?mapsA(v.g.lat,v.g.lon):"chưa có dữ liệu")+'</td></tr>').join("")+'</table></div></details>';
  }
  if(r.near.length){
    h+='<details><summary>Trạm số hiệu gần '+r.enb+' (±'+NEAR+', '+r.near.length+' trạm)</summary><div class="tblw"><table class="tbl"><tr><th>eNB</th><th>Lệch</th><th>TAC</th><th>Vị trí</th></tr>'+
      r.near.slice(0,20).map(v=>'<tr><td>'+v.enb+'</td><td>'+v.d+'</td><td>'+v.tacs.map(x=>x[0]).join(", ")+'</td><td>'+mapsA(v.lat,v.lon)+'</td></tr>').join("")+'</table></div></details>';
  }
  return h+'</div>';
}
function tViaOnly(enbs,map){
  return '<div class="tc"><h3>Các trạm (eNodeB)</h3><div class="tblw"><table class="tbl"><tr><th>#</th><th>Mạng</th><th>eNB</th><th>TAC</th><th>Vị trí</th></tr>'+
    enbs.map((e,i)=>{const nets=e.net?[e.net]:NETS.filter(n=>n.mnc).map(n=>n.mnc);let g=null;for(const n of nets){g=map.get(n*2097152+e.enb);if(g)break}
      return '<tr><td>'+(i+1)+'</td><td>'+(g?n2(g.net):e.net?n2(e.net):"")+'</td><td>'+e.enb+'</td><td>'+(g?g.tacs.map(x=>x[0]).join(", "):"–")+'</td><td>'+(g?mapsA(g.lat,g.lon):"chưa có dữ liệu")+'</td></tr>'}).join("")+
    '</table></div></div>';
}
function tRun(){
  if(!DB.n&&!TAC.extra.length){tsay("Chưa có dữ liệu. Bấm “Nạp file” và chọn 452.csv.gz (dùng chung với tab Tra CGI ngược).","err");return}
  const defNet=+$("tnet").value;
  const {cells,enbs}=tParse($("tq").value,defNet);
  if(!cells.length&&!enbs.length){tsay("Không thấy ECGI / CGI / số cell nào. Ví dụ: 452-01-253826161","err");return}
  const want=new Set();
  cells.forEach(c=>{const e=Math.floor(c.eci/256);for(let d=-NEAR;d<=NEAR;d++)want.add(e+d)});
  enbs.forEach(e=>want.add(e.enb));
  const map=tCollect((net,enb)=>want.has(enb));
  const res=cells.map(c=>tAnalyze(c,enbs,map));
  TAC.last={res};
  let h=res.map(tCardHtml).join("");
  if(!cells.length&&enbs.length)h+=tViaOnly(enbs,map);
  $("tlist").innerHTML=h||'<div class="empty">Không có kết quả.</div>';
  const ok=res.filter(r=>r.exact.length||r.t.fromTai).length,est=res.filter(r=>!r.exact.length&&!r.t.fromTai&&r.cands.length).length;
  tsay(cells.length?(ok?"Tìm thấy đúng TAC cho "+ok+" cell. ":"")+(est?"Ước lượng TAC cho "+est+" cell. ":"")+(cells.length-ok-est?"Không suy được "+(cells.length-ok-est)+" cell.":""):"Đã tra "+enbs.length+" trạm.",ok?"ok":est?"":"err");
  if(matchMedia("(max-width:959px)").matches)$("l-tres").scrollIntoView({behavior:"smooth",block:"start"});
}
$("tFind").onclick=tRun;
$("tlist").addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.cp){copy(b.dataset.cp,b);return}
  if(b.dataset.api!==undefined){
    const r=TAC.last&&TAC.last.res[+b.dataset.api];if(!r||!r.pos)return;
    b.disabled=true;
    try{
      const got=await queryApi(r.pos[0],r.pos[1],2000,r.t.net||0,4,2000);
      const k=new Set(TAC.extra.map(o=>o.net+"-"+o.cell));got.forEach(o=>{if(!k.has(o.net+"-"+o.cell))TAC.extra.push(o)});
      tRun();tsay("API trả về "+got.length+" cell 4G quanh vị trí ước lượng"+(state.apiUsed?" ("+state.apiUsed+")":"")+", đã tính lại.",got.length?"ok":"");
    }catch(e){tsay(e.message,"err");b.disabled=false}
  }
});

$("coord").dispatchEvent(new Event("input"));
drawRadar();
})();
</script>
