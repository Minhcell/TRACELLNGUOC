name: Build APK Tra CGI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Chuẩn bị Android SDK (dùng SDK có sẵn trên máy build)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK: $SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -n 1)"; fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$SDK" > local.properties

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Chép giao diện web vào APK
        run: |
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -r web/. app/src/main/assets/www/
          ls -la app/src/main/assets/www

      - name: Giải mã keystore (nếu đã khai secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "Có keystore: build bản release đã ký"
          else
            echo "Không có keystore: build bản debug (vẫn cài được)"
          fi

      - name: Build APK release (đã ký)
        if: env.SIGNED == '1'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build APK debug
        if: env.SIGNED != '1'
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Đặt tên file APK
        run: |
          mkdir -p out
          for f in $(find app/build/outputs/apk -name "*.apk"); do
            cp "$f" "out/TraCGI-v1.0.${{ github.run_number }}-$(basename "$f" .apk | sed 's/^app-//').apk"
          done
          ls -la out

      - name: Tải APK lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TraCGI-apk
          path: out/*.apk

      - name: Đăng APK lên mục Releases (tải thẳng trên điện thoại)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tra CGI v1.0.${{ github.run_number }}
          files: out/*.apk
